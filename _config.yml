title: pipe23
# Empty, so the footer's first column is blank. Without the key the theme repeats the title there.
author: ""
description: "Independent research and engineering on public infrastructure."
url: "https://pipe23.org"
theme: minima

# A file in _pages is a page at /<file name>/ with the page layout. The theme
# lists every page that has a title in the header.
include: [_pages]
defaults:
  - scope: {path: "_pages"}
    values: {layout: page, permalink: "/:basename/"}
  - scope: {path: "index.md"}
    values: {list_title: Notes}
